[project]
name = "assistant-rag-erp-simule"
version = "0.1.0"
description = "RAG assistant over a synthetic ERP corpus (invoices, stock, orders), with a quantified evaluation layer"
authors = [
    {name = "jazi",email = "molka.jazi3009@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pydantic (>=2.14.1,<3.0.0)",
    "faker (>=40.43.0,<41.0.0)"
]

[tool.poetry]
packages = [{include = "erp_rag", from = "src"}]

[tool.poetry.group.dev.dependencies]
ruff = "^0.16.8"
pytest = "^9.1.1"
ipykernel = "^7.4.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
