name: CI                          # name displayed in the Actions tab

on:                               # TRIGGERS: when to run the workflow
  push:                           # on every push
  # pull_request:                   # on every PR
  # workflow_dispatch:              # manual "Run workflow" button (kata step 5)

jobs:
  lint:                           # JOB: checks code style
    runs-on: ubuntu-latest        # RUNNER: GitHub's Linux machine
    steps:
      - uses: actions/checkout@v4          # 1. download your code (otherwise the runner is empty)
      - uses: actions/setup-python@v5      # 2. install Python
        with:
          python-version: "^3.11"          #    match the same version as in your pyproject.toml
      - run: pipx install poetry           # 3. install Poetry (not present by default)
      - run: poetry install                # 4. install your dependencies (ruff, pytest)
      - run: poetry run ruff check .       # 5. the lint check

  test:                           # JOB: runs the unit tests (separate runner from the lint job)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "^3.11"
      - run: pipx install poetry
      - run: poetry install
      - run: poetry run pytest             # the unit tests

# Why 2 separate jobs (lint + test) instead of one job with 2 steps:
# - By default, jobs run in PARALLEL (unlike steps within the same job,
#   which run in sequence and stop at the first failure).
# - If lint fails, we still want to know whether the tests pass, in the
#   same push, not only after fixing lint and pushing again.
# - It also gives 2 separate, visible checks on the PR (clearer at a
#   glance: is it just style, or is the logic actually broken).
# Cost: each job reinstalls everything from scratch (checkout, python,
# poetry, dependencies) since they're two different runners, so there's
# some duplication and a bit more total compute, but it's negligible at
# this size.
